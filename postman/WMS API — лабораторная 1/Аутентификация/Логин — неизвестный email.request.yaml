$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "nobody@example.com",
      "password": "Password1!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('401', () => pm.response.to.have.status(401));
      pm.test('тот же текст, что у неверного пароля', () => pm.expect(pm.response.json().error.message).to.eql('Неверный email или пароль'));
    language: text/javascript
order: 8000
