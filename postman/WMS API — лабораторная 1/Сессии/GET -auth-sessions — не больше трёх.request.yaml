$kind: http-request
name: GET /auth/sessions — не больше трёх
url: "{{baseUrl}}/auth/sessions"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{workerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('не больше трёх сессий', () => pm.expect(pm.response.json().data.length).to.be.at.most(3));
    language: text/javascript
order: 4000
