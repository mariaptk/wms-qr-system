$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "lock@example.com",
      "password": "Password1!",
      "name": "Блокировка"
    }
scripts:
  - type: afterResponse
    code: pm.test('201 или 409', () => pm.expect([201, 409]).to.include(pm.response.code));
    language: text/javascript
order: 1000
