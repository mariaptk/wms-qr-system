$kind: http-request
name: PATCH /products кладовщиком — 403
url: "{{baseUrl}}/products/{{productId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Чужая правка"
    }
auth:
  type: bearer
  credentials:
    token: "{{workerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
