$kind: http-request
name: DELETE /products кладовщиком — 403
url: "{{baseUrl}}/products/{{productId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{workerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
