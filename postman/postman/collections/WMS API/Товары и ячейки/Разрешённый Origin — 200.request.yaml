$kind: http-request
url: "{{baseUrl}}/products"
method: GET
headers:
  Origin: http://localhost:5173
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('CORS-заголовок', () => pm.response.to.have.header('Access-Control-Allow-Origin', 'http://localhost:5173'));
    language: text/javascript
order: 10000
