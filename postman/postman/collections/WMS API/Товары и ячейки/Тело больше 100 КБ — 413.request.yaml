$kind: http-request
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sku": "BIG-1",
      "name": "{{bigName}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{workerToken}}"
scripts:
  - type: beforeRequest
    code: pm.variables.set('bigName', 'a'.repeat(150 * 1024));
    language: text/javascript
  - type: afterResponse
    code: pm.test('413', () => pm.response.to.have.status(413));
    language: text/javascript
order: 11000
