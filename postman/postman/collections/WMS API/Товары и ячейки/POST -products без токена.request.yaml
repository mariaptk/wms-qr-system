$kind: http-request
name: POST /products без токена
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sku": "MILK-01",
      "name": "Молоко"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
