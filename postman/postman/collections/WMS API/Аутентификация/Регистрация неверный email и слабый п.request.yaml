$kind: http-request
name: Регистрация неверный email и слабый пароль
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "not-an-email",
      "password": "short"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
      const fields = pm.response.json().error.details.map((d) => d.field);
      pm.test('ошибки email и password', () => pm.expect(fields).to.include.members(['email', 'password']));
    language: text/javascript
order: 2000
