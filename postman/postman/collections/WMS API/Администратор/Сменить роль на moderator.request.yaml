$kind: http-request
url: "{{baseUrl}}/users/{{userId}}/role"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "role": "moderator"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('роль moderator', () => pm.expect(pm.response.json().data.role).to.eql('moderator'));
    language: text/javascript
order: 7000
