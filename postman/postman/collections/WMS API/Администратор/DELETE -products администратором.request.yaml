$kind: http-request
name: DELETE /products администратором
url: "{{baseUrl}}/products/{{productId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
